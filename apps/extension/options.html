<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herdown设置</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #070a0e; color: #e2e8f0; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(680px, calc(100% - 32px)); margin: 44px auto; }
    header { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; }
    .logo { display: block; width: 40px; height: 40px; border-radius: 12px; }
    h1 { margin: 0; color: #fff; font-size: 25px; } .subtle { margin: 2px 0 0; color: #94a3b8; }
    section { margin-bottom: 16px; padding: 20px; border: 1px solid #1e293b; border-radius: 16px; background: #0d131d; }
    h2 { margin: 0 0 14px; font-size: 16px; color: #fff; } label { display: block; margin: 14px 0 6px; color: #cbd5e1; font-size: 13px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #263445; border-radius: 9px; outline: 0; background: #090d13; color: #e2e8f0; font: inherit; }
    .hint { margin: 6px 0 0; color: #64748b; font-size: 12px; } .actions { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
    button { border: 0; border-radius: 9px; padding: 10px 18px; background: linear-gradient(135deg, #0f6b4f, #10b981); color: #fff; font-weight: 700; cursor: pointer; } #status { color: #34d399; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header><img class="logo" src="icons/icon48.png" alt="Herdown"><div><h1 id="title">Herdown设置</h1><p class="subtle" id="subtitle">设置剪藏保存方式</p></div></header>
    <section>
      <h2 id="general-title">基本设置</h2>
      <label for="language" id="language-label">界面语言</label>
      <select id="language"><option value="auto">跟随浏览器</option><option value="zh">中文</option><option value="en">English</option></select>
      <label for="download-folder" id="download-folder-label">下载文件夹</label>
      <input id="download-folder" value="Herdown md" placeholder="Herdown md">
      <p class="hint" id="download-folder-hint">下载的Markdown会保存在这个文件夹下。</p>
    </section>
    <section>
      <h2 id="obsidian-title">Obsidian保存</h2>
      <label for="vault" id="vault-label">Vault名称</label><input id="vault" placeholder="My Vault">
      <label for="folder" id="folder-label">默认文件夹</label><input id="folder" value="Herdown" placeholder="Herdown">
      <p class="hint" id="obsidian-hint">可选。填写后，存入Obsidian会使用这里的Vault和文件夹。</p>
    </section>
    <div class="actions"><button id="save">保存设置</button><span id="status"></span></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
