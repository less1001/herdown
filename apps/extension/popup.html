<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herdown剪藏</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { width: 380px; margin: 0; padding: 12px; background: #070a0e; color: #e2e8f0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; padding-bottom: 9px; border-bottom: 1px solid #1e293b; }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 16px; font-weight: 800; }
    .mark { display: block; width: 30px; height: 30px; flex: 0 0 auto; border-radius: 8px; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .site-link { padding: 4px 7px; border: 1px solid #263445; border-radius: 7px; color: #94a3b8; font-size: 11px; text-decoration: none; white-space: nowrap; }
    .site-link:hover { border-color: #10b981; color: #5eead4; }
    .icon-button { width: 28px; height: 28px; padding: 0; border: 1px solid #263445; background: #111823; color: #94a3b8; font-size: 16px; line-height: 1; }
    .icon-button:hover { border-color: #10b981; color: #5eead4; }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 10px; }
    button { border: 0; border-radius: 9px; cursor: pointer; font: inherit; font-weight: 700; }
    .mode { padding: 8px; border: 1px solid #263445; background: #0d131d; color: #cbd5e1; }
    .mode.active { border-color: #10b981; background: rgba(16, 185, 129, 0.12); color: #5eead4; }
    .view-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .view-tab { padding: 5px 9px; border: 1px solid transparent; background: transparent; color: #64748b; font-size: 11px; }
    .view-tab.active { border-color: #1f8f70; background: rgba(16, 185, 129, 0.1); color: #5eead4; }
    .content-preview, textarea { width: 100%; height: 190px; min-height: 190px; max-height: 190px; overflow: auto; padding: 10px; border: 1px solid #263445; border-radius: 10px; outline: 0; background: #090d13; color: #cbd5e1; }
    .content-preview { white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.55; }
    .content-preview h1, .content-preview h2, .content-preview h3 { margin: 0 0 10px; color: #f8fafc; line-height: 1.35; }
    .content-preview h1 { font-size: 19px; }
    .content-preview h2 { font-size: 16px; }
    .content-preview h3 { font-size: 14px; }
    .content-preview p { margin: 0 0 8px; }
    .content-preview a { color: #7dd3fc; }
    .content-preview code { padding: 1px 4px; border-radius: 4px; background: #111823; color: #86efac; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    textarea { resize: none; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
    textarea:focus { border-color: #10b981; }
    .meta { margin: 6px 0 8px; color: #64748b; font-size: 10px; }
    .count-line { display: flex; justify-content: flex-end; }
    .primary { width: 100%; padding: 8px; background: linear-gradient(135deg, #0f6b4f, #10b981); color: #fff; }
    .secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .secondary button { padding: 7px; border: 1px solid #263445; background: #111823; color: #cbd5e1; }
    .utility { display: flex; justify-content: space-between; margin-top: 6px; }
    .utility button { padding: 0; background: transparent; color: #60a5fa; font-size: 11px; font-weight: 500; }
    #status { min-height: 14px; margin-top: 5px; color: #64748b; font-size: 10px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img class="mark" src="icons/icon48.png" alt="Herdown"><span>Herdown</span></div>
    <div class="header-actions">
      <a class="site-link" id="website-link" href="https://herdown.com/" target="_blank" rel="noreferrer">打开官网</a>
      <button class="icon-button" id="settings" type="button" aria-label="设置" title="设置">&#9881;</button>
    </div>
  </header>

  <div class="modes">
    <button class="mode active" id="full-page" type="button">整篇文章</button>
    <button class="mode" id="selection" type="button">划选内容</button>
  </div>

  <div class="view-tabs" role="tablist" aria-label="查看方式">
    <button class="view-tab active" id="content-view" type="button" role="tab" aria-selected="true">内容预览</button>
    <button class="view-tab" id="source-view" type="button" role="tab" aria-selected="false">Markdown源码</button>
  </div>
  <div class="content-preview" id="content-preview" role="tabpanel">正在读取当前页面...</div>
  <textarea id="preview" spellcheck="false" aria-label="Markdown源码" hidden></textarea>
  <div class="meta">
    <span class="count-line" id="count-label"></span>
  </div>

  <button class="primary" id="save-obsidian" type="button">存入Obsidian</button>
  <div class="secondary">
    <button id="copy-markdown" type="button">复制Markdown</button>
    <button id="download-markdown" type="button">下载.md文件</button>
  </div>
  <div class="utility">
    <button id="retry" type="button">重新提取</button>
  </div>
  <div id="status" role="status"></div>

  <script src="lib/defuddle.js"></script>
  <script src="popup.js"></script>
</body>
</html>
